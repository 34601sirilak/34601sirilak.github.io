<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>หน้าหลักเว็บไซต์ของฉัน</title>

    <!-- ข้อมูลสำหรับตอนแชร์ลิงก์ -->
    <meta property="og:title" content="Sirilak | Portfolio">
    <meta property="og:description" content="แฟ้มสะสมผลงานของสิริลักษณ์ ผาดผ่อง">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://34601sirilak.github.io/">

    <!-- รูปหน้าปกตอนแชร์ -->
    <meta property="og:image" content="https://34601sirilak.github.io/45E1DEB7-D377-4807-8F1D-0FC5536C5C96.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Sirilak Portfolio">

    <!-- สำหรับ X/Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sirilak | Portfolio">
    <meta name="twitter:description" content="แฟ้มสะสมผลงานของสิริลักษณ์ ผาดผ่อง">
    <meta name="twitter:image" content="https://34601sirilak.github.io/45E1DEB7-D377-4807-8F1D-0FC5536C5C96.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 20%, #ffffff 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, #ffdff0 0%, transparent 25%),
                linear-gradient(135deg, #dff6ff, #f8e4ff, #ffe5f1);
            color: #555;
            text-align: center;
            padding: 50px 20px;
            font-family: Arial, Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 40px;
            box-shadow:
                0 15px 40px rgba(150, 120, 190, 0.18);
            max-width: 700px;
            width: 100%;
            margin: auto;
            padding: 45px 35px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
        }

        /* วงกลมตกแต่ง */
        .card::before {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            background: #dff6ff;
            border-radius: 50%;
            top: -80px;
            left: -60px;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            background: #ffe1ef;
            border-radius: 50%;
            bottom: -65px;
            right: -45px;
        }

        /* ลายตกแต่งอยู่นิ่ง */
        .decoration {
            position: relative;
            z-index: 2;
            font-size: 25px;
            margin-bottom: 10px;
            letter-spacing: 8px;
        }

        h1 {
            position: relative;
            z-index: 2;
            color: #6daed6;
            font-size: 34px;
            line-height: 1.5;
            margin: 0 0 28px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #ffe1ef;
        }

        /* กรอบรูปตรงกลาง */
        .profile-frame {
            position: relative;
            z-index: 2;
            width: 205px;
            height: 205px;
            padding: 9px;
            margin: 0 auto 35px;
            background: linear-gradient(135deg, #aee5ff, #ffc6df);
            border-radius: 50%;

            box-shadow:
                0 8px 25px rgba(150, 120, 190, 0.22),
                0 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /*
            เส้นปะรอบรูป
            อยู่นิ่ง ไม่หมุน
        */
        .profile-frame::before {
            content: "";
            position: absolute;
            top: -17px;
            left: -17px;
            width: calc(100% + 34px);
            height: calc(100% + 34px);
            border: 3px dashed #f3a9c8;
            border-radius: 50%;
            pointer-events: none;
        }

        /*
            วงแหวนวิ้ง ๆ รอบรูป
            อยู่นิ่ง ไม่หมุน
        */
        .profile-frame::after {
            content: "✦  ✧  ✦  ✧  ✦  ✧  ✦  ✧";
            position: absolute;
            top: -42px;
            left: 50%;
            width: 290px;
            height: 290px;
            transform: translateX(-50%);
            border-radius: 50%;
            color: #f3a9c8;
            font-size: 22px;
            letter-spacing: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 0;
            white-space: nowrap;
            pointer-events: none;
            text-shadow:
                0 0 5px #ffffff,
                0 0 10px #f3a9c8,
                0 0 15px #9ddcf5;
        }

        /* ภาพโปรไฟล์ */
        .profile-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
            position: relative;
            z-index: 3;
        }

        /* วิ้งเล็ก ๆ รอบรูป อยู่นิ่ง */
        .profile-frame .sparkle {
            position: absolute;
            z-index: 5;
            color: #f3a9c8;
            font-size: 25px;
            opacity: 0.8;
            text-shadow:
                0 0 5px white,
                0 0 12px #f3a9c8,
                0 0 18px #9ddcf5;
            pointer-events: none;
        }

        .sparkle-1 {
            top: -30px;
            left: 20px;
        }

        .sparkle-2 {
            top: 25px;
            right: -35px;
        }

        .sparkle-3 {
            bottom: -30px;
            right: 25px;
        }

        .sparkle-4 {
            bottom: 25px;
            left: -35px;
        }

        p {
            position: relative;
            z-index: 2;
            font-size: 18px;
            line-height: 1.8;
            color: #555;
            margin: 18px 0;
        }

        strong {
            color: #e58bb5;
        }

        .btn {
            position: relative;
            z-index: 3;
            display: inline-block;
            margin-top: 18px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #75c9ed, #e9a9cf);
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 18px;
            box-shadow:
                0 6px 16px rgba(180, 140, 190, 0.22);
            transition: 0.25s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #5eb8df, #dc8fbc);
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            .card {
                padding: 35px 20px;
                border-radius: 30px;
            }

            h1 {
                font-size: 27px;
            }

            .profile-frame {
                width: 185px;
                height: 185px;
            }

            .profile-frame::after {
                width: 265px;
                height: 265px;
                font-size: 18px;
                letter-spacing: 5px;
            }

            .profile-frame::before {
                top: -14px;
                left: -14px;
                width: calc(100% + 28px);
                height: calc(100% + 28px);
            }

            .profile-frame .sparkle {
                font-size: 20px;
            }

            .sparkle-1 {
                top: -25px;
                left: 15px;
            }

            .sparkle-2 {
                right: -28px;
            }

            .sparkle-3 {
                bottom: -25px;
                right: 15px;
            }

            .sparkle-4 {
                left: -28px;
            }

            p {
                font-size: 17px;
            }

            .btn {
                font-size: 16px;
                padding: 13px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="decoration">
            ☁️🫧☁️🫧
        </div>

        <h1>
            🙌🏻ยินดีต้อนรับสู่โปรไฟล์ของฉัน🙌🏻
        </h1>

        <!-- กรอบรูปโปรไฟล์ -->
        <div class="profile-frame">

            <!-- ดาววิ้งรอบรูป -->
            <span class="sparkle sparkle-1">✦</span>
            <span class="sparkle sparkle-2">✧</span>
            <span class="sparkle sparkle-3">✦</span>
            <span class="sparkle sparkle-4">✧</span>

            <!-- ภาพโปรไฟล์ -->
            <img
                src="45E1DEB7-D377-4807-8F1D-0FC5536C5C96.png"
                alt="รูปโปรไฟล์ สิริลักษณ์ ผาดผ่อง"
                class="profile-image"
            >

        </div>

        <p>
            สวัสดีค่ะ!🦋 ฉันชื่อ
            <strong>
                🌟สิริลักษณ์ ผาดผ่อง (Sirilak Phartpong)🌟
            </strong>
        </p>

        <p>
            📍ขณะนี้กำลังศึกษาชั้นมัธยมศึกษาปีที่6
            แผนการเรียน เตรียมวิศวกรรมศาสตร์👷‍♀️
        </p>

        <p>
            🎯เป้าหมายในชีวิต คุณครูวิทยาศาสตร์
        </p>

        <a href="portfolio.html" class="btn">
            📚 🔎ดูแฟ้มสะสมงานของฉัน🔍📚
        </a>

    </div>

</body>
</html>
