<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | สิริลักษณ์ ผาดผ่อง</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Tahoma", sans-serif;

            background: linear-gradient(
                135deg,
                #eee6ff,
                #e8eaff,
                #dff3ff
            );

            color: #3f3158;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           เมนูด้านบน
        ========================= */

        nav {
            width: 100%;
            padding: 18px 8%;

            background: rgba(255, 255, 255, 0.75);

            box-shadow:
                0 4px 15px rgba(95, 70, 150, 0.12);

            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;

            color: #7250a8;
        }

        /* =========================
           หน้าแรก
        ========================= */

        .home {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        .content {
            width: 100%;
            max-width: 800px;

            text-align: center;

            background: rgba(255, 255, 255, 0.55);

            padding: 45px 30px;

            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(88, 68, 140, 0.15);

            backdrop-filter: blur(8px);
        }

        /* =========================
           รูปโปรไฟล์
        ========================= */

        .profile {
            width: 230px;
            height: 230px;

            margin: 0 auto 30px;

            border-radius: 50%;

            object-fit: cover;

            border: 8px solid white;

            box-shadow:
                0 8px 25px rgba(91, 70, 150, 0.25);
        }

        /* =========================
           ข้อมูล
        ========================= */

        .name {
            font-size: 38px;
            font-weight: bold;

            margin-bottom: 18px;

            background: linear-gradient(
                90deg,
                #7549a8,
                #4b8fce
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info {
            font-size: 21px;
            line-height: 2;

            color: #57466e;

            margin-bottom: 25px;
        }

        .info strong {
            color: #66449a;
        }

        /* =========================
           ข้อความแนะนำ
        ========================= */

        .welcome {
            font-size: 18px;

            color: #6a5b7c;

            margin-bottom: 30px;
        }

        /* =========================
           ปุ่ม
        ========================= */

        .button {
            display: inline-block;

            text-decoration: none;

            color: white;

            font-size: 18px;
            font-weight: bold;

            padding: 14px 32px;

            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #7951b3,
                #5799d5
            );

            box-shadow:
                0 7px 18px rgba(91, 72, 150, 0.25);

            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 25px rgba(91, 72, 150, 0.35);
        }

        /* =========================
           Footer
        ========================= */

        footer {
            text-align: center;

            padding: 18px;

            font-size: 14px;

            color: #756783;

            background: rgba(255, 255, 255, 0.6);
        }

        /* =========================
           มือถือ
        ========================= */

        @media (max-width: 600px) {

            .content {
                padding: 35px 20px;
            }

            .profile {
                width: 190px;
                height: 190px;
            }

            .name {
                font-size: 28px;
            }

            .info {
                font-size: 17px;
            }

            .welcome {
                font-size: 15px;
            }

            .button {
                font-size: 16px;
                padding: 12px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ส่วนหัว
    ========================= -->

    <nav>
        <div class="logo">
            My Portfolio 
        </div>
    </nav>


    <!-- =========================
         หน้าแรก
    ========================= -->

    <main class="home">

        <div class="content">

            <!-- รูปโปรไฟล์ -->

            <img
                src="45E1DEB7-D377-4807-8F1D-0FC5536C5C96.png"
                alt="รูปโปรไฟล์ สิริลักษณ์ ผาดผ่อง"
                class="profile"
            >


            <!-- ชื่อ -->

            <h1 class="name">
                นางสาวสิริลักษณ์ ผาดผ่อง
            </h1>


            <!-- ข้อมูลการศึกษา -->

            <div class="info">

                <p>
                    นักเรียนชั้นมัธยมศึกษาปีที่ 6
                </p>

                <p>
                    แผนการเรียน <strong>เตรียมวิศวกรรมศาสตร์</strong>
                </p>

            </div>


            <!-- ข้อความ -->

            <p class="welcome">
                ยินดีต้อนรับเข้าสู่แฟ้มสะสมผลงานของฉัน 
            </p>


            <!-- ปุ่ม -->

            <a
                href="portfolio.html"
                class="button"
            >
             📚🔍 เข้าดูผลงานของฉัน 🔎📚
            </a>

        </div>

    </main>


    <!-- =========================
         Footer
    ========================= -->

    <footer>
        © 2026 สิริลักษณ์ ผาดผ่อง
    </footer>

</body>
</html>
