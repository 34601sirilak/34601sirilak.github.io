<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลักเว็บไซต์ของฉัน</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #e8f7ff,
                #c9edff,
                #b9e5fa
            );
            color: #333;
            text-align: center;
            padding: 50px 20px;
            font-family: Arial, Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 40px;
            box-shadow:
                0 12px 35px rgba(74, 157, 196, 0.20);
            max-width: 700px;
            width: 100%;
            margin: auto;
            padding: 45px 35px;
            border: 3px solid rgba(255,255,255,0.9);
            position: relative;
            overflow: hidden;
        }
        /* วงกลมตกแต่ง */
        .card::before {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            background: #e0f5ff;
            border-radius: 50%;
            top: -65px;
            left: -50px;
        }
        .card::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            background: #d5f1ff;
            border-radius: 50%;
            bottom: -55px;
            right: -40px;
        }
        .decoration {
            position: relative;
            z-index: 2;
            font-size: 25px;
            margin-bottom: 10px;
            letter-spacing: 8px;
        }
        h1 {
            position: relative;
            z-index: 2;
            color: #2f91cc;
            font-size: 34px;
            line-height: 1.5;
            margin: 0 0 28px;
            font-weight: bold;
        }
        p {
            position: relative;
            z-index: 2;
            font-size: 18px;
            line-height: 1.8;
            color: #444;
            margin: 18px 0;
        }
        strong {
            color: #2589c1;
        }
        .btn {
            position: relative;
            z-index: 3;
            display: inline-block;
            margin-top: 18px;
            padding: 14px 28px;
            background: #55afe0;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 15px;
            box-shadow:
                0 6px 16px rgba(65, 155, 200, 0.22);
            transition: 0.25s;
        }
        .btn:hover {
            background: #3d9ed2;
            transform: translateY(-3px);
        }
        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }
            .card {
                padding: 35px 20px;
                border-radius: 30px;
            }
            h1 {
                font-size: 27px;
            }
            p {
                font-size: 17px;
            }
            .btn {
                font-size: 16px;
                padding: 13px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="decoration">
            ☁️ 🦋 ✨
        </div>
        <h1>
            👑ยินดีต้อนรับสู่โปรไฟล์ของฉัน👑
        </h1>
        <p>
            สวัสดีค่ะ!🦋 ฉันชื่อ
            <strong>
            🌟สิริลักษณ์ ผาดผ่อง (Sirilak Phartpong)🌟
            </strong>
        </p>
        <p>
           📍ขณะนี้กำลังศึกษาชั้นมัธยมศึกษาปีที่6 แผนการเรียน เตรียมวิศวกรรมศาสตร์👷‍♀️
        </p>
        <p>
           🎯เป้าหมายในชีวิต คุณครูวิทยาศาสตร์
        </p>
        <a href="portfolio.html" class="btn">
          📚 🔎ดูแฟ้มสะสมงานของฉัน🔍📚
        </a>
    </div>
</body>
</html>
