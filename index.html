<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sirilak | Portfolio</title>

<meta property="og:title" content="Sirilak | Portfolio">
<meta property="og:description" content="แฟ้มสะสมผลงานของสิริลักษณ์ ผาดผ่อง">
<meta property="og:type" content="website">
<meta property="og:url" content="https://34601sirilak.github.io/">
<meta property="og:image" content="https://34601sirilak.github.io/45E1DEB7-D377-4807-8F1D-0FC5536C5C96.png">

<meta name="twitter:card" content="summary_large_image">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Tahoma","Arial",sans-serif;
    color:#555;
    background:
        radial-gradient(circle at 10% 10%,#ffffff 0,transparent 25%),
        radial-gradient(circle at 90% 90%,#ffddec 0,transparent 28%),
        linear-gradient(135deg,#dff7ff,#f6e7ff,#ffe7f2);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 15px;
    overflow-x:hidden;
}

/* ==============================
   MAIN CARD
============================== */

.main-card{
    position:relative;
    width:100%;
    max-width:850px;

    padding:55px 45px;

    background:rgba(255,255,255,.94);

    border-radius:40px;

    border:4px solid white;

    box-shadow:
        0 20px 50px rgba(130,110,170,.20);

    overflow:hidden;

    text-align:center;
}

/* decoration */

.main-card::before{
    content:"";
    position:absolute;

    width:220px;
    height:220px;

    background:#def6ff;

    border-radius:50%;

    top:-110px;
    left:-90px;

    opacity:.8;
}

.main-card::after{
    content:"";
    position:absolute;

    width:190px;
    height:190px;

    background:#ffe0ee;

    border-radius:50%;

    right:-90px;
    bottom:-90px;

    opacity:.8;
}

/* ==============================
   CONTENT
============================== */

.content{
    position:relative;
    z-index:5;
}

.top-decoration{
    font-size:25px;
    color:#e8a1c2;
    letter-spacing:8px;
    margin-bottom:20px;
}

.title{
    color:#6caed3;

    font-size:38px;

    line-height:1.5;

    margin-bottom:40px;

    text-shadow:
        2px 2px 0 #ffe2ef;
}

.subtitle{
    font-size:18px;
    color:#888;
}

/* ==============================
   PROFILE IMAGE
============================== */

.photo-box{
    position:relative;

    width:245px;
    height:245px;

    margin:0 auto 55px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.photo-box::before{
    content:"";

    position:absolute;

    width:275px;
    height:275px;

    border:3px dashed #efa5c6;

    border-radius:50%;

    animation:rotate 10s linear infinite;
}

.photo-box::after{
    content:"";

    position:absolute;

    width:250px;
    height:250px;

    border:7px solid #def5ff;

    border-radius:50%;
}

.profile-photo{
    position:relative;

    z-index:5;

    width:205px;
    height:205px;

    object-fit:cover;

    border-radius:50%;

    border:7px solid white;

    box-shadow:
        0 0 0 7px #f2abc9,
        0 0 0 14px #fff0f7,
        0 0 0 20px #dff5ff,
        0 12px 30px rgba(170,130,180,.25);

    animation:float 3s ease-in-out infinite;
}

/* stars */

.star{
    position:absolute;

    z-index:10;

    color:#efa5c6;

    font-size:30px;

    text-shadow:
        0 0 8px white,
        0 0 15px #efa5c6;
}

.star-a{
    top:-20px;
    left:5px;
}

.star-b{
    top:25px;
    right:-5px;
}

.star-c{
    bottom:0;
    left:-5px;
}

.star-d{
    bottom:-10px;
    right:20px;
}

/* ==============================
   TEXT
============================== */

.introduction{
    font-size:20px;

    line-height:1.9;

    margin:18px auto;

    max-width:700px;
}

.name{
    color:#df83ad;
    font-weight:bold;
}

.info{
    font-size:18px;

    line-height:1.9;

    margin:10px auto;
}

.goal{
    margin-top:20px;

    font-size:20px;

    color:#666;
}

.goal span{
    color:#d86c9e;
    font-weight:bold;
}

/* ==============================
   BUTTON
============================== */

.portfolio-button{
    display:inline-block;

    margin-top:30px;

    padding:17px 35px;

    border-radius:25px;

    text-decoration:none;

    color:white;

    font-size:18px;

    font-weight:bold;

    background:
        linear-gradient(135deg,#72c8ec,#e49ac1);

    box-shadow:
        0 10px 25px rgba(160,140,190,.25);

    transition:.3s;
}

.portfolio-button:hover{
    transform:translateY(-5px) scale(1.03);

    box-shadow:
        0 15px 30px rgba(160,140,190,.35);
}

/* ==============================
   FOOTER
============================== */

.footer{
    margin-top:35px;

    font-size:14px;

    color:#8aa2b0;
}

/* ==============================
   ANIMATION
============================== */

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-9px);
    }

}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

/* ==============================
   MOBILE
============================== */

@media(max-width:600px){

    body{
        padding:15px;
    }

    .main-card{
        padding:40px 20px;
        border-radius:30px;
    }

    .top-decoration{
        font-size:18px;
        letter-spacing:4px;
    }

    .title{
        font-size:27px;
        margin-bottom:35px;
    }

    .photo-box{
        width:205px;
        height:205px;

        margin-bottom:50px;
    }

    .photo-box::before{
        width:230px;
        height:230px;
    }

    .photo-box::after{
        width:210px;
        height:210px;
    }

    .profile-photo{
        width:170px;
        height:170px;
    }

    .star{
        font-size:22px;
    }

    .introduction{
        font-size:17px;
    }

    .info{
        font-size:15px;
    }

    .goal{
        font-size:17px;
    }

    .portfolio-button{
        font-size:15px;
        padding:14px 22px;
    }

}

</style>
</head>

<body>

<div class="main-card">

    <div class="content">

        <div class="top-decoration">
            ⋆🐾˚ ༘ ⋆｡˚⋆ ̊🐾˖°
        </div>

        <h1 class="title">
             ยินดีต้อนรับสู่โปรไฟล์ของฉัน 
        </h1>

        <!-- รูปโปรไฟล์ -->

        <div class="photo-box">

            <span class="star star-a">✦</span>
            <span class="star star-b">✧</span>
            <span class="star star-c">✦</span>
            <span class="star star-d">✧</span>

            <img
                src="45E1DEB7-D377-4807-8F1D-0FC5536C5C96.png"
                alt="รูปโปรไฟล์ สิริลักษณ์ ผาดผ่อง"
                class="profile-photo"
            >

        </div>

        <!-- ข้อมูลเดิม -->

        <p class="introduction">
            สวัสดีค่ะ! ฉันชื่อ
            <span class="name">
                สิริลักษณ์ ผาดผ่อง (Sirilak Phartpong)
            </span>
        </p>

        <p class="info">
            ขณะนี้กำลังศึกษาชั้นมัธยมศึกษาปีที่6
            แผนการเรียน เตรียมวิศวกรรมศาสตร์👷‍♀️
        </p>

        <p class="goal">
            🎯เป้าหมายในชีวิต
            <span>คุณครูวิทยาศาสตร์</span>
        </p>

        <!-- ไป Portfolio -->

        <a href="portfolio.html" class="portfolio-button">
            📚 🔎 ดูแฟ้มสะสมงานของฉัน 🔍 📚
        </a>

        <div class="footer">
            ✨ Sirilak Phartpong | Portfolio ✨
        </div>

    </div>

</div>

</body>
</html>
