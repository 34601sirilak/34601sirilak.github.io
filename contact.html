<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | ช่องทางการติดต่อ</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #eee6ff,
                #e8eaff,
                #dff3ff
            );

            color: #4b3b60;

            padding-top: 85px;
        }


        /* =========================
           เมนูด้านบน
        ========================= */

        nav {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            padding: 15px 10px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            box-shadow:
                0 3px 15px rgba(90, 70, 150, 0.15);

            z-index: 9999;
        }


        nav a {
            display: inline-block;

            text-decoration: none;

            color: #60428d;

            font-weight: bold;

            margin: 3px 5px;

            padding: 8px 12px;

            border-radius: 20px;

            transition: 0.3s;
        }


        nav a:hover {
            color: white;

            background: linear-gradient(
                90deg,
                #7951b3,
                #5799d5
            );

            transform: translateY(-2px);
        }


        /* =========================
           กล่องหลัก
        ========================= */

        .container {
            width: 92%;

            max-width: 850px;

            margin: 50px auto;

            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.88);

            border-radius: 30px;

            box-shadow:
                0 12px 35px rgba(90, 70, 150, 0.16);
        }


        /* =========================
           หัวข้อ
        ========================= */

        .title {
            text-align: center;

            font-size: 36px;

            color: #704ca5;

            margin-bottom: 12px;
        }


        .subtitle {
            text-align: center;

            font-size: 18px;

            color: #6a5b7c;

            margin-bottom: 35px;
        }


        /* =========================
           กล่องติดต่อ
        ========================= */

        .contact-card {
            width: 100%;

            padding: 25px;

            margin-bottom: 20px;

            text-align: center;

            border-radius: 25px;

            background: linear-gradient(
                100deg,
                rgba(239, 229, 255, 0.95),
                rgba(224, 242, 255, 0.95)
            );

            border: 2px solid #c5b5df;

            box-shadow:
                0 7px 20px rgba(91, 70, 150, 0.12);

            transition: 0.3s;
        }


        .contact-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 25px rgba(91, 70, 150, 0.18);
        }


        .contact-card h2 {
            font-size: 22px;

            color: #654393;

            margin-bottom: 12px;
        }


        .contact-card p {
            font-size: 18px;

            color: #514361;

            line-height: 1.7;
        }


        /* =========================
           ลิงก์ Email / โทร
        ========================= */

        .contact-card a {
            color: #4b78b5;

            font-weight: bold;

            text-decoration: none;
        }


        .contact-card a:hover {
            color: #704ca5;

            text-decoration: underline;
        }


        /* =========================
           ปุ่มด้านล่าง
        ========================= */

        .buttons {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-top: 40px;
        }


        .btn {
            display: inline-block;

            text-decoration: none;

            color: white;

            font-weight: bold;

            padding: 13px 27px;

            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #7951b3,
                #5799d5
            );

            box-shadow:
                0 6px 15px rgba(90, 70, 150, 0.2);

            transition: 0.3s;
        }


        .btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 20px rgba(90, 70, 150, 0.3);
        }


        /* =========================
           มือถือ
        ========================= */

        @media (max-width: 700px) {

            body {
                padding-top: 125px;
            }


            nav {
                padding: 10px 5px;
            }


            nav a {
                font-size: 12px;

                padding: 6px 8px;

                margin: 2px;
            }


            .container {
                width: 92%;

                padding: 35px 18px;
            }


            .title {
                font-size: 29px;
            }


            .subtitle {
                font-size: 16px;
            }


            .contact-card {
                padding: 22px 15px;
            }


            .contact-card h2 {
                font-size: 20px;
            }


            .contact-card p {
                font-size: 16px;

                word-break: break-word;
            }


            .buttons {
                flex-direction: column;
            }


            .btn {
                text-align: center;
            }

        }

    </style>
</head>
