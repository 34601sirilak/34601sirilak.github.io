<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | ติดต่อ</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Tahoma", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eee5ff, #dff1ff);
            color: #3f3158;
            padding-top: 75px;
        }

        /* =========================
           แถบเมนูด้านบน
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 10px;
            background: linear-gradient(90deg, #7652b5, #5799d5);
            text-align: center;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-weight: bold;
            font-size: 15px;
        }

        nav a:hover {
            color: #ffe6f5;
        }

        /* =========================
           เนื้อหา
        ========================= */

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 34px;
            color: #7045a8;
            margin-bottom: 10px;
        }

        .title p {
            font-size: 17px;
            color: #5f5470;
        }

        /* =========================
           ช่องทางติดต่อ
        ========================= */

        .contact-section {
            background: rgba(255,255,255,0.9);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(80,60,120,0.15);
        }

        .contact-section h2 {
            text-align: center;
            color: #7045a8;
            font-size: 26px;
            margin-bottom: 25px;
        }

        .contact-card {
            background: linear-gradient(135deg, #f8f1ff, #eef9ff);
            padding: 25px;
            margin: 18px 0;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(80,60,120,0.1);
        }

        .contact-card h3 {
            color: #7652b5;
            font-size: 21px;
            margin-bottom: 12px;
        }

        .contact-card a {
            color: #4d82c4;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        .contact-card a:hover {
            color: #7045a8;
            text-decoration: underline;
        }

        /* =========================
           ปุ่มนำทาง
        ========================= */

        .navigation-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 35px 0;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 27px;
            border-radius: 30px;
            background: linear-gradient(90deg, #7652b5, #5799d5);
            color: white;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 12px rgba(80,60,120,0.2);
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        /* =========================
           มือถือ
        ========================= */

        @media (max-width: 700px) {

            body {
                padding-top: 125px;
            }

            nav {
                padding: 12px 5px;
                line-height: 2;
            }

            nav a {
                font-size: 13px;
                margin: 0 4px;
            }

            .contact-section {
                padding: 22px;
            }

            .navigation-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 90%;
                text-align: center;
            }
        }
    </style>
</head>
